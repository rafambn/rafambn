    <stop offset=".13" stop-color="#fff0ce"/><stop offset=".3" stop-color="#e9ddc6"/>
    <stop offset=".49" stop-color="#d7d0c3"/><stop offset=".7" stop-color="#adb2b0"/>
    <stop offset=".88" stop-color="#818e96"/><stop offset=".98" stop-color="#586c79"/>
    <stop offset="1" stop-color="#b5b9ae"/>
