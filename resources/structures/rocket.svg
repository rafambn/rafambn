<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1000" viewBox="0 0 400 1000" role="img" aria-labelledby="rocket-title rocket-desc">
<title id="rocket-title">Ready for launch</title>
<desc id="rocket-desc">An ivory and silver rocket with a red arrow emblem, two side boosters, exposed engine bells and a steel launch mount. Warm dawn light catches its left edge. The hull reads Build, Learn, Share, Repeat and A more open tomorrow. The boosters read Simpler tools and Brighter people.</desc>
