  <g id="gantry-railing-section" fill="none">
    <path d="M0 0V-26H35V0M0-13H35" stroke="#603b2c" stroke-width="2.5"/>
    <path d="M-1-26H34M-1-13H34M-1-26V0M34-26V0" stroke="#da935e" stroke-width=".9"/>
  </g>
  <g id="gantry-service-deck">
    <!-- Brackets transfer the cantilever loads into the tower columns. -->
    <path d="M-151 17L9 128V20M-91 20L9 88M139 19L84 83" fill="none" stroke="#492b23" stroke-width="14"/>
    <path d="M-151 17L9 128V20M-91 20L9 88M139 19L84 83" fill="none" stroke="#ac4c29" stroke-width="9"/>
    <path d="M-151 14L6 123M-91 17L6 84M138 17L82 80" fill="none" stroke="#e59054" stroke-width="1.7"/>
    <path d="M-111 20V46M-72 20V74M-33 20V101" fill="none" stroke="#834026" stroke-width="5"/>
    <path d="M-162 0L-145-12H162L145 0Z" fill="#cb7845"/>
    <path d="M-162 0L-145-12H162L145 0Z" fill="url(#gantry-deck-grating)"/>
    <path d="M145 0L162-12V12L145 26Z" fill="#713724"/>
    <path d="M-162 0H145V25H-162Z" fill="url(#gantry-girder)" stroke="#683222"/>
    <path d="M-163 0H146M-163 25H146" stroke="#e38c54" stroke-width="2"/>
    <path d="M-143 4V21M-100 4V21M-57 4V21M-14 4V21M29 4V21M72 4V21M115 4V21" stroke="#6e3324" stroke-width="3"/>
    <path d="M-141 4V21M-98 4V21M-55 4V21M-12 4V21M31 4V21M74 4V21M117 4V21" stroke="#ce7745"/>
    <use href="#gantry-bolt" x="-154" y="7"/><use href="#gantry-bolt" x="-154" y="18"/>
    <use href="#gantry-bolt" x="136" y="7"/><use href="#gantry-bolt" x="136" y="18"/>
    <g transform="translate(-160 0)">
