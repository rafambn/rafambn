    <rect x="99" y="103" width="17" height="984" fill="url(#gantry-ladder-rungs)"/>
    <path d="M100 1087V103H115V1087" fill="none" stroke="#d39b63" stroke-width="2.5"/>
    <g transform="translate(99 168)">
      <use href="#gantry-cage-ring"/><use href="#gantry-cage-ring" y="110"/>
      <use href="#gantry-cage-ring" y="220"/><use href="#gantry-cage-ring" y="330"/>
      <use href="#gantry-cage-ring" y="440"/><use href="#gantry-cage-ring" y="550"/>
      <use href="#gantry-cage-ring" y="660"/><use href="#gantry-cage-ring" y="770"/>
    </g>
    <path d="M93 171V967M123 171V967" stroke="#895837" stroke-width="1.5"/>
    <!-- Nine open bays keep the landscape visible through the steelwork. -->
    <g transform="translate(0 100)">
      <use href="#gantry-bay"/><use href="#gantry-bay" y="110"/>
      <use href="#gantry-bay" y="220"/><use href="#gantry-bay" y="330"/>
      <use href="#gantry-bay" y="440"/><use href="#gantry-bay" y="550"/>
      <use href="#gantry-bay" y="660"/><use href="#gantry-bay" y="770"/>
      <use href="#gantry-bay" y="880"/>
    </g>
    <rect x="-5" y="88" width="15" height="1004" fill="url(#gantry-column)" stroke="#713521"/>
    <rect x="83" y="88" width="15" height="1004" fill="url(#gantry-column)" stroke="#713521"/>
    <path d="M-4 89V1092M84 89V1092" stroke="#eda873" stroke-width="1.6"/>
    <g fill="#8f4129" stroke="#d57d49">
      <path d="M-7 425H12V449H-7ZM81 425H100V449H81Z"/>
      <path d="M-7 755H12V779H-7ZM81 755H100V779H81Z"/>
    </g>
    <use href="#gantry-bolt" x="2" y="431"/><use href="#gantry-bolt" x="2" y="443"/>
    <use href="#gantry-bolt" x="90" y="431"/><use href="#gantry-bolt" x="90" y="443"/>
    <use href="#gantry-bolt" x="2" y="761"/><use href="#gantry-bolt" x="2" y="773"/>
    <use href="#gantry-bolt" x="90" y="761"/><use href="#gantry-bolt" x="90" y="773"/>
    <!-- Splayed legs land on shoes and concrete plinths, behind the base railing. -->
    <path d="M-75 1088L2 862M-47 1008H0M-27 950H0" fill="none" stroke="#5a3023" stroke-width="17"/>
    <path d="M-75 1088L2 862M-47 1008H0M-27 950H0" fill="none" stroke="#ad4f2c" stroke-width="11"/>
    <path d="M-80 1088L-3 862M-47 1003H0M-27 945H0" fill="none" stroke="#e38e55" stroke-width="2"/>
    <path d="M-88 1086H-58V1095H-88ZM-14 1086H20V1095H-14ZM75 1086H109V1095H75Z" fill="#8b4027" stroke="#df9156"/>
    <path d="M-99 1095L-91 1089H-56L-48 1095ZM-23 1095L-15 1089H22L30 1095ZM65 1095L73 1089H111L120 1095Z" fill="#ded0ae"/>
    <path d="M-99 1095H-48V1110H-99ZM-23 1095H30V1110H-23ZM65 1095H120V1110H65Z" fill="url(#gantry-foot)"/>
    <path d="M-86 1095V1088M-61 1095V1088M-12 1095V1088M18 1095V1088M77 1095V1088M106 1095V1088" stroke="#453e31" stroke-width="2.5"/>
    <use href="#gantry-service-deck" y="300"/>
    <use href="#gantry-service-deck" y="550"/>
    <use href="#gantry-service-deck" y="800"/>
    <g transform="translate(118 222) scale(.55 1)"><use href="#gantry-access-arm"/></g>
    <g transform="translate(118 472) scale(.55 1)"><use href="#gantry-access-arm"/></g>
    <g transform="translate(118 722) scale(.55 1)"><use href="#gantry-access-arm"/></g>
    <g transform="translate(118 972) scale(.55 1)"><use href="#gantry-access-arm"/></g>
  </g>
</defs>
<g transform="translate(300 0)">
  <use href="#gantry-tower" x="238"/>
  <g transform="translate(1000 0) scale(-1 1)"><use href="#gantry-tower" x="238"/></g>

  <!-- The crown is an open truss, with room below for the rocket nose. -->
