<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="gantry-title gantry-desc">
<title id="gantry-title">Red steel launch gantry</title>
<desc id="gantry-desc">Twin lattice towers with three cantilevered service decks on each side, a crown bridge, access ladders, suspended hoses and amber warning lights. The central launch opening is clear.</desc>
<style>
@keyframes gantry-pulse {0%,100%{opacity:1} 50%{opacity:.3}}
.gantry-beacon-light {animation:gantry-pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.gantry-beacon-light{animation:none}}
</style>
<defs>
  <linearGradient id="gantry-column" x2="1" y2="0">
    <stop stop-color="#f1a16b"/><stop offset=".14" stop-color="#cb6338"/>
    <stop offset=".35" stop-color="#a64428"/><stop offset=".8" stop-color="#b5502d"/>
    <stop offset="1" stop-color="#642f24"/>
  </linearGradient>
  <linearGradient id="gantry-girder" x2="0" y2="1">
    <stop stop-color="#db8350"/><stop offset=".13" stop-color="#ba5830"/>
    <stop offset=".22" stop-color="#773725"/><stop offset=".76" stop-color="#a3492a"/>
    <stop offset=".84" stop-color="#642f24"/><stop offset="1" stop-color="#c56a3e"/>
  </linearGradient>
  <linearGradient id="gantry-depth" x2="1" y2=".2">
    <stop stop-color="#713523"/><stop offset=".55" stop-color="#472c25"/><stop offset="1" stop-color="#934225"/>
  </linearGradient>
  <linearGradient id="gantry-foot" x2="0" y2="1">
    <stop stop-color="#c6ba9c"/><stop offset="1" stop-color="#7e8378"/>
  </linearGradient>
  <radialGradient id="gantry-light-glow">
    <stop stop-color="#fff2b5" stop-opacity=".85"/><stop offset=".25" stop-color="#ffc66e" stop-opacity=".35"/>
    <stop offset="1" stop-color="#ffad4e" stop-opacity="0"/>
  </radialGradient>
  <pattern id="gantry-ladder-rungs" width="17" height="13" patternUnits="userSpaceOnUse">
    <path d="M2 6H15" stroke="#472f25" stroke-width="3"/><path d="M2 5H15" stroke="#c38d58" stroke-width="1.4"/>
  </pattern>
  <pattern id="gantry-deck-grating" width="8" height="8" patternUnits="userSpaceOnUse">
    <path d="M0 1H8M1 0V8" stroke="#e49c64" stroke-opacity=".35" stroke-width=".7"/>
  </pattern>
  <g id="gantry-bolt">
    <circle r="2.1" fill="#4f3026"/><path d="M-1.3-.8L0-1.6 1.4-.7 1.4.8 0 1.5-1.3.7Z" fill="#d99462"/>
    <path d="M-.7-.9H.8" stroke="#f4c389" stroke-width=".6"/>
  </g>
  <g id="gantry-bay">
    <path d="M7 2L86 108M86 2L7 108" fill="none" stroke="#4c2c24" stroke-width="10"/>
    <path d="M7 2L86 108M86 2L7 108" fill="none" stroke="#ae4e2b" stroke-width="7"/>
    <path d="M5 3L84 108M84 2L5 108" fill="none" stroke="#e38b53" stroke-width="1.5"/>
    <path d="M0 0H93V12H0Z" fill="url(#gantry-girder)"/>
    <path d="M-1 0H94" stroke="#f3b37a" stroke-width="1.5"/>
    <path d="M0 11L16 11 0 29ZM93 11H77L93 29ZM0 110V91L16 110ZM93 110V91L77 110Z" fill="#793b28"/>
    <path d="M39 50H54V66H39Z" fill="#95442a" stroke="#d78450"/>
    <use href="#gantry-bolt" x="43" y="54"/><use href="#gantry-bolt" x="50" y="62"/>
    <use href="#gantry-bolt" x="6" y="5"/><use href="#gantry-bolt" x="87" y="5"/>
    <use href="#gantry-bolt" x="6" y="103"/><use href="#gantry-bolt" x="87" y="103"/>
  </g>
  <g id="gantry-side-bay">
    <path d="M0 0L26-13V97L0 110Z" fill="none" stroke="#583023" stroke-width="5"/>
    <path d="M0 0L26 97M26-13L0 110" fill="none" stroke="#8c4026" stroke-width="4"/>
    <path d="M0 1L25-11M1 1L25 96" fill="none" stroke="#c16e3d" stroke-width="1.2"/>
  </g>
  <g id="gantry-cage-ring" fill="none">
    <path d="M0 0C-8 5-8 15 0 20H17C25 15 25 5 17 0" stroke="#4e3328" stroke-width="3"/>
    <path d="M0-1C-8 4-8 14 0 19H17C25 14 25 4 17-1" stroke="#bb8050" stroke-width="1.4"/>
  </g>
  <g id="gantry-beacon">
