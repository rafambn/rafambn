  <path d="M796 83L814 69V101L796 115Z" fill="#713925"/>
  <path d="M215 86L273 115 331 86 389 115 447 86 505 115 563 86 621 115 679 86 737 115 795 86" fill="none" stroke="#573125" stroke-width="7"/>
  <path d="M215 85L273 114 331 85 389 114 447 85 505 114 563 85 621 114 679 85 737 114 795 85" fill="none" stroke="#bb6338" stroke-width="4"/>
  <path d="M202 80H796V89H202ZM202 112H796V121H202Z" fill="url(#gantry-girder)" stroke="#763723"/>
  <path d="M202 80H796M202 112H796" stroke="#f0ad72" stroke-width="1.5"/>
  <path d="M202 121L241 165M796 121L758 165" stroke="#713b26" stroke-width="9"/>
  <path d="M201 120L240 164M795 120L757 164" stroke="#d07843" stroke-width="3"/>
  <g transform="translate(220 78)">
    <use href="#gantry-railing-section"/><use href="#gantry-railing-section" x="35"/>
    <use href="#gantry-railing-section" x="70"/><use href="#gantry-railing-section" x="105"/>
    <use href="#gantry-railing-section" x="140"/><use href="#gantry-railing-section" x="175"/>
    <use href="#gantry-railing-section" x="210"/><use href="#gantry-railing-section" x="245"/>
    <use href="#gantry-railing-section" x="280"/><use href="#gantry-railing-section" x="315"/>
    <use href="#gantry-railing-section" x="350"/><use href="#gantry-railing-section" x="385"/>
    <use href="#gantry-railing-section" x="420"/><use href="#gantry-railing-section" x="455"/>
    <use href="#gantry-railing-section" x="490"/><use href="#gantry-railing-section" x="525"/>
  </g>
  <use href="#gantry-beacon" x="219" y="51"/><use href="#gantry-beacon" x="782" y="51"/>

  <!-- Small service fittings break the symmetry without filling the launch opening. -->
  <g transform="translate(135 273)">
    <rect x="-9" y="-31" width="18" height="31" rx="3" fill="#747568" stroke="#443d30"/>
    <path d="M-6-28V-4M0-31V-39H7V-47M-12-7H12" fill="none" stroke="#d3b080" stroke-width="2"/>
    <path d="M-9-22H9M-9-6H9" stroke="#46463a" stroke-width="2"/>
  </g>
  <g transform="translate(834 522)">
    <path d="M0 0V-27H23V0Z" fill="#65675b" stroke="#413a2d"/>
    <path d="M4-23H19M4-19H19M4-15H19M4-11H19" stroke="#b9a27c"/>
    <path d="M21-4H33V10" fill="none" stroke="#403c32" stroke-width="3"/>
  </g>
  <path d="M873 773V728M869 733H877M875 773V754H887" fill="none" stroke="#8d6744" stroke-width="3"/>
</g>
</svg>
