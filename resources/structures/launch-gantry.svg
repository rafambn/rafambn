      <use href="#gantry-side-bay" y="440"/><use href="#gantry-side-bay" y="550"/>
      <use href="#gantry-side-bay" y="660"/><use href="#gantry-side-bay" y="770"/>
      <use href="#gantry-side-bay" y="880"/>
    </g>
    <path d="M120 83V1086" stroke="#b75b32" stroke-width="5"/>
    <path d="M-17 1088V138Q-17 125-4 125H5M-25 1088V490Q-25 478-12 478H3" fill="none" stroke="#542f24" stroke-width="7"/>
    <path d="M-18 1088V138Q-18 124-4 124H5M-26 1088V490Q-26 477-12 477H3" fill="none" stroke="#ce844d" stroke-width="2.5"/>
