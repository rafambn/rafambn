      <use href="#gantry-railing-section" x="140"/><use href="#gantry-railing-section" x="175"/>
      <use href="#gantry-railing-section" x="210"/><use href="#gantry-railing-section" x="245"/>
      <path d="M280-26H305V0M280-13H305M305-26L322-38V-12M305-13L322-25" fill="none" stroke="#a96a44" stroke-width="2"/>
    </g>
    <use href="#gantry-beacon" x="-147" y="-26"/>
    <path d="M-135 10h16m34 9h19m44-13h10M32 7h24m29 14h11" stroke="#e19a60" stroke-width=".7" opacity=".65"/>
  </g>
  <g id="gantry-access-arm">
    <path d="M0-10H69L91 1H170V12H87L65 2H0Z" fill="#5a3426"/>
    <path d="M0-12H70L93-1H170V3H91L68-8H0Z" fill="#c27142"/>
    <path d="M0 3H66L89 15H170V21H86L63 9H0Z" fill="url(#gantry-girder)"/>
    <path d="M4-12V-34H67L91-23H169V-1M4-22H67L91-11H169M26-34V-12M47-34V-12M68-33V-9M91-23V-1M116-23V-1M143-23V-1" fill="none" stroke="#723e2a" stroke-width="2.5"/>
    <path d="M4-35H67L91-24H169M4-23H67L91-12H169" fill="none" stroke="#e0a06b"/>
    <path d="M7 9L49 34 80 16M91 21L126 43 160 21" fill="none" stroke="#9a4c2d" stroke-width="4"/>
    <path d="M27 12C48 83 81 78 93 24M35 14C52 68 75 62 86 24M98 22C116 67 142 65 155 23" fill="none" stroke="#3a3931" stroke-width="4"/>
    <path d="M26 12C47 82 80 77 92 24M98 21C116 65 141 63 154 23" fill="none" stroke="#ad9971" stroke-width="1"/>
  </g>
  <g id="gantry-tower">
    <!-- Recessed side bracing, ladder and utility risers. -->
    <path d="M91 92L121 77V1085H91Z" fill="url(#gantry-depth)"/>
    <g transform="translate(93 100)">
